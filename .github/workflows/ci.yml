name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install from lock
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Strict typing
        run: uv run mypy src
      - name: Tests and coverage
        run: uv run pytest
      - name: Dependency audit
        run: uv run pip-audit
      - name: Migration round-trip
        run: uv run python scripts/check_migrations.py

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run test:e2e

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run cyclonedx-py environment --output-file python-sbom.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx @cyclonedx/cyclonedx-npm --output-file ../node-sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            python-sbom.json
            node-sbom.json
