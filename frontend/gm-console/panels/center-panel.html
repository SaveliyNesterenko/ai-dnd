<!-- Character Action Generator -->
<div id="character-action-generator">
    <h2>Generate Character Action</h2>
    <input type="text" id="charKey" placeholder="Enter Character ID">
    <div id="generate-button-container">
        <button id="sendBtn">Generate</button>
    </div>
    <textarea id="modelOutput" rows="8" cols="50" readonly></textarea>
    <div id="response-buttons" style="display: none;">
        <button id="retryBtn">Retry</button>
        <button id="sendResponseBtn">Send for Analysis</button>
        <button id="sendWithDiceRollBtn">Send for Analysis with Dice Roll</button>
    </div>
</div>

<hr style="margin: 20px 0;">

<!-- GM Console -->
<div id="gm-console">
    <h2>GM Console</h2>
    <div class="gm-input-container">
        <textarea id="gm-input" placeholder="Введите действие от имени ГМ..."></textarea>
        <div class="gm-buttons">
            <button id="send-gm-action">Отправить</button>
            <button id="send-gm-action-dice">Отправить с Dice Roll</button>
        </div>
    </div>
</div>
