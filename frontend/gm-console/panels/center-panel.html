<div class="editor-container">
    <h1>GM Console</h1>

    <!-- Поле для ID персонажа -->
    <div class="input-group">
        <label for="charKey">ID Персонажа:</label>
        <input type="text" id="charKey" placeholder="Например, grommash">
    </div>

    <!-- Текстовое поле для ответа -->
    <textarea class="model response" id="modelOutput" placeholder="Здесь появится ответ нейросети..."></textarea>

    <div id="generate-button-container">
        <button class="generate-btn" id="sendBtn">Сгенерировать ответ</button>
    </div>

    <div id="response-buttons" style="display: none;">
        <button id="retryBtn" class="response-btn">Повторить</button>
        <button id="sendResponseBtn" class="response-btn">Отправить</button>
        <button id="sendWithDiceRollBtn" class="response-btn">Отправить с Dice Roll</button>
    </div>
</div>
