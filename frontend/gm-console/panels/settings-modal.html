<!-- Settings Modal -->
<div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-close-btn">&times;</span>
        <h2>Настройки</h2>
        <div class="setting-item">
            <label for="avatar-size-slider">Размер аватаров:</label>
            <input type="range" id="avatar-size-slider" min="50" max="500" value="300">
            <span id="avatar-size-value">300px</span>
        </div>
        <!-- Содержимое настроएको -->
    </div>
</div>
