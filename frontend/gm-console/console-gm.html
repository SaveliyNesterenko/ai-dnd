<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Console - AI Orchestrator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grid-container">
        <div id="top-panel" class="panel"></div>
        <div id="left-panel" class="panel"></div>
        <div id="center-panel" class="panel"></div>
        <div id="right-panel" class="panel"></div>
        <div id="bottom-panel" class="panel"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const panels = {
                "top-panel": "panels/top-panel.html",
                "left-panel": "panels/left-panel.html",
                "center-panel": "panels/center-panel.html",
                "right-panel": "panels/right-panel.html",
                "bottom-panel": "panels/bottom-panel.html"
            };

            for (const panelId in panels) {
                fetch(panels[panelId])
                    .then(response => response.text())
                    .then(html => {
                        const panelElement = document.getElementById(panelId);
                        panelElement.innerHTML = html;
                        // If the loaded HTML contains scripts, we need to manually execute them
                        const scripts = panelElement.getElementsByTagName('script');
                        for (let i = 0; i < scripts.length; i++) {
                            const script = document.createElement('script');
                            if (scripts[i].src) {
                                script.src = scripts[i].src;
                            } else {
                                script.innerHTML = scripts[i].innerHTML;
                            }
                            document.body.appendChild(script);
                        }
                    })
                    .catch(err => console.warn(`Could not load ${panelId}:`, err));
            }
        });
    </script>
</body>
</html>
