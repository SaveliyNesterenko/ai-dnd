<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зрительский экран</title>
    <link rel="stylesheet" href="spectator.css">
</head>
<body>
    <div id="character-cards-container">
        <!-- Сюда будут динамически добавляться карточки персонажей -->
    </div>

    <div id="character-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modal-character-details">
                <!-- Сюда будут загружаться полные данные о персонаже -->
            </div>
        </div>
    </div>

    <div id="background-container"></div>
    <div id="avatars-container">
        <!-- Сюда будут динамически добавляться аватары персонажей -->
    </div>

    <!-- Контейнер для отображения бросков кубика -->
    <div id="dice-roll-container"></div>

    <script src="spectator.js"></script>
</body>
</html>
